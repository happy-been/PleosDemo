        **ARTIFACTORYREPOSITORY**
        google()
        mavenCentral()
        maven {
            url 'https://nexus-playground.pleos.ai/repository/maven-releases/'
            content { includeGroup 'ai.pleos.playground' }
        }
        flatDir { dirs "${project(':unityLibrary').projectDir}/libs" }
    }
}
